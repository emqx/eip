  </text>

  <rect x="545" y="55" width="110" height="390" rx="3" fill="url(#bricks)" stroke="#653126" stroke-width="7" filter="url(#shadow)"/>

  <rect x="755" y="170" width="365" height="160" rx="18" fill="#e7f7ec" stroke="#39854c" stroke-width="4" filter="url(#shadow)"/>
  <text x="937.5" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="650" fill="#245b31">
