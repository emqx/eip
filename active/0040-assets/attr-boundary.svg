  </defs>

  <rect width="1200" height="500" rx="28" fill="#f7f8fa"/>

  <rect x="80" y="170" width="365" height="160" rx="18" fill="#fff0dc" stroke="#dc6b19" stroke-width="4" filter="url(#shadow)"/>
